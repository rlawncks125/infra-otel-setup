apiVersion: 1

groups:
  - orgId: 1
    name: Service Alert Rules
    folder: Observability
    interval: 1m
    rules:
      - uid: elysia-http-5xx-ratio
        title: Service HTTP 5xx Ratio High
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 5xx error ratio is higher than 2% for 5 minutes
          description: Check recent traces in Jaeger and route-level metrics in Grafana.
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              exemplar: false
              expr: "100 * ((sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[5m])) or 0 * sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[5m]))) / clamp_min(sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[5m])), 0.001))"
              instant: true
              intervalMs: 1000
              legendFormat: ''
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '__expr__'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '__expr__'
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

apiVersion: 1

# Copy this file to notification-policies.yml when you are ready.
# This routes warning+ alerts to Slack and critical alerts to Discord.
policies:
  - orgId: 1
    receiver: Elysia Slack
    group_by: [alertname, service]
    routes:
      - receiver: Elysia Discord
        object_matchers:
          - [severity, =, critical]
